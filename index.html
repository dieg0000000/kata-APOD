<head>

<meta name="description" content="Un navigateur alternatif pour l'Astronomy Picture of the Day (APOD) de la NASA.">

<div class="app">

  <header class="topbar">
    <h1>Astronomy Picture of the Day</h1>
  </header> 

  <div id="settingsPanel" class="settings-panel">
    <label for="apiKeyInput">NASA API Key</label>
    <div class="settings-row">
      <input id="apiKeyInput" type="text" value ="">
      <button id="apiKeySave" class="button">Save</button>
    </div>
    </div>

  <main id="card" class="card">
    <div class="status">Loading…</div>
  </main>
<button onclick="share()" class="button">Copy Link</button>

  <footer>
    Source code available on
